spring:
  application:
    name: web-ai-management
  #mysql连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/tlias
    username: root
    password: 1234

  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小(包括所有文件和表单数据)(一次上传多个文件的总大小)
      max-request-size: 100MB

#spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug


# mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

#阿里云OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: kemali-javaweb
    region: cn-beijing

# 测试环境白名单：放行所有/test开头的接口、swagger文档、健康检查等
security:
  whitelist:
    - /test/**
    - /swagger-ui/**
    - /v3/api-docs/**
    - /actuator/**
    - /health/**
    - /emps/**